schema_version: 1
actions:
  create_issue:
    class: ticket
    mutating: false
    reversible: true
    blast: {mode: fixed, value: 0}
    target_pattern: '^[a-z0-9][a-z0-9_-]{1,62}$'
  restart_pod:
    class: service_mutation
    mutating: true
    reversible: true
    blast: {mode: target_replicas}
    target_pattern: '^baac-[a-z-]+$'
  scale_up:
    class: service_mutation
    mutating: true
    reversible: true
    blast: {mode: target_replicas}
    target_pattern: '^baac-[a-z-]+$'
  propose_retrain:
    class: model_mutation
    mutating: false
    reversible: false
    blast: {mode: fixed, value: 3}
    target_pattern: '^[a-z0-9_]+$'
