schema_version: 2
default_effect: deny
levels:
  L1: {effect: allow}
  L2: {effect: require_approval, approvals: 1}
  L3: {effect: require_approval, approvals: 2}
actions:
  create_issue:    {level: L1, blast_radius_max: 2}
  restart_pod:     {level: L2, blast_radius_max: 2, rate_limit: "1/hour"}
  scale_up:        {level: L2, blast_radius_max: 3, rate_limit: "2/hour"}
  propose_retrain: {level: L3}
rules:
  - id: R-001
    kind: upstream_masks_service
    applies_to_classes: [service_mutation, model_mutation]
    min_severity: WARNING
    description: >
      Une anomalie data/feature au moins aussi sévère que celle de l'infra
      interdit toute mutation de service ou de modèle (SIM-003, SIM-011).
  - id: R-002
    kind: risk_register_forbids
    applies_to_classes: [service_mutation, model_mutation]
    description: Actions listées dans risk_register.yaml pour ce risk_id.
