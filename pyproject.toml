[project]
name = "agentic-ops"
version = "0.1.0"
description = "A generic, plug-and-play Agentic Control Plane for MLOps Governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "prefect>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agentic-ops = "agentic_ops.cli.main:app"
