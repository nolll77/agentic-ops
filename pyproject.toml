[project]
name = "agentic-ops"
version = "0.1.10"
description = "A generic, plug-and-play Agentic Control Plane for MLOps Governance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "prefect>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.0",
    "httpx[socks]>=0.27.0",
    "kubernetes>=29.0.0",
    "instructor>=1.0.0",
    "litellm>=1.0.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.0.0",
    "fakeredis>=2.20.0",
    "mcp>=2.3.0",
    "PyJWT[crypto]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.20.0",
    "hypothesis>=6.0.0",
    "fakeredis>=2.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_ops"]

[tool.hatch.build.targets.wheel.force-include]
"agentic_ops/governance/alert_classification.yaml" = "agentic_ops/governance/alert_classification.yaml"
"agentic_ops/governance/action_catalog.yaml" = "agentic_ops/governance/action_catalog.yaml"
"agentic_ops/governance/autonomy_policy.yaml" = "agentic_ops/governance/autonomy_policy.yaml"
"agentic_ops/governance/risk_register.yaml" = "agentic_ops/governance/risk_register.yaml"
"agentic_ops/governance/shadow_policy.yaml" = "agentic_ops/governance/shadow_policy.yaml"

[project.scripts]
agentic-ops = "agentic_ops.cli.main:app"
agentic-start = "agentic_ops.cli.main:start_server"
agentic-mcp = "agentic_ops.entrypoints.mcp_server:run_stdio_server"
agentic-alert-worker = "agentic_ops.entrypoints.alert_worker:run_alert_worker"
agentic-approval-worker = "agentic_ops.entrypoints.approval_worker:run_approval_worker"
agentic-ops-db = "agentic_ops.entrypoints.sqlite_backup:main"
agentic-ops-benchmark-alerts = "agentic_ops.entrypoints.alert_benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
