replicaCount: 1

# Local SQLite files are shared only by the API and worker in this single Pod.
# Keep replicaCount=1; this is a persistent single-node profile, not HA storage.
persistence:
  enabled: true
  size: 2Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  mountPath: /var/lib/agentic-ops

crypto:
  # Create this Kubernetes Secret out-of-band; the same persistent signing key
  # must be shared by the API and every worker.
  signingSecretName: ""
  signingSecretKey: LEDGER_SECRET_KEY

apiAuth:
  # Required when Entra is disabled; protects the alert-status/admin endpoints.
  secretName: ""
  secretKey: ADMIN_API_KEY
  previousSecretKey: ""

grafanaWebhook:
  # Required while alertWorker is enabled.
  secretName: ""
  secretKey: GRAFANA_WEBHOOK_SECRET
  previousSecretKey: ""

alertWorker:
  enabled: true
  pollIntervalSeconds: 1
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

approvalWorker:
  # Disabled until an enterprise identity provider replaces the static role mapping.
  enabled: false
  pollIntervalSeconds: 1
  approversSecretName: ""
  approversSecretKey: SLACK_APPROVERS_JSON
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

inventory:
  # When enabled, provide a fresh exact-name target allowlist. Without it,
  # policy decisions fail closed with INV-001.
  enabled: false
  generatedAt: ""
  maxAgeSeconds: 86400
  targets: {}

identity:
  # Entra OIDC protects admin APIs when tenant and audience are configured.
  entraTenantId: ""
  entraApiAudience: ""
  entraRequiredRole: AgenticOps.Admin
  # SCIM replaces static Slack role mapping and provisions externalId=Slack member ID.
  scimEnabled: false
  scimBearerSecretName: ""
  scimBearerSecretKey: SCIM_BEARER_TOKEN

image:
  repository: ghcr.io/nolll77/agentic-ops
  pullPolicy: IfNotPresent
  # Publish the matching application image before deploying this chart version.
  tag: "v0.1.4"

serviceAccount:
  create: true
  name: "agentic-ops-sa"

rbac:
  create: true
  clusterRole: false
  rules:
    # Read-only pour les logs et pods (Contexte Agent)
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
    # Patch uniquement pour le restart de Déploiement (Exécution Restreinte)
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "patch"]

env:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    httpGet:
      path: /ready
      port: 8001
    initialDelaySeconds: 5
    periodSeconds: 10
