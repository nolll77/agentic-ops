replicaCount: 1

image:
  repository: nolll77/agentic-ops
  pullPolicy: IfNotPresent
  # MLOps Pure: Épinglage de version plutôt que latest
  tag: "v0.1.0"

serviceAccount:
  create: true
  name: "agentic-ops-sa"

rbac:
  create: true
  clusterRole: false
  rules:
    # Read-only pour les logs et pods (Contexte Agent)
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
    # Patch uniquement pour le restart de Déploiement (Exécution Restreinte)
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "patch"]

env:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

probes:
  liveness:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
