name: Publish release to PyPI, GHCR and Docker Hub

on:
  release:
    types: [published]

jobs:
  build-package:
    name: Build and validate release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: pip install -e ".[dev]"

      - name: Run release test suite
        run: pytest tests/ -q -p no:randomly

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Release tag {tag!r} does not match project version {version!r}; "
                  f"expected {expected_tag!r}"
              )
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit(f"Release tag {tag!r} must use semantic version vX.Y.Z")

          chart = Path("helm/agentic-ops/Chart.yaml").read_text()
          values = Path("helm/agentic-ops/values.yaml").read_text()
          for label, content, pattern in (
              ("Helm chart version", chart, rf'(?m)^version:\s*["\']?{re.escape(version)}["\']?\s*$'),
              ("Helm appVersion", chart, rf'(?m)^appVersion:\s*["\']?{re.escape(version)}["\']?\s*$'),
              ("Helm image tag", values, rf'(?m)^\s+tag:\s*["\']?v{re.escape(version)}["\']?\s*$'),
          ):
              if not re.search(pattern, content):
                  raise SystemExit(f"{label} must match release version {version}")
          print(f"Validated release {tag} for package version {version}")
          PY

      - name: Build package distributions
        run: uv build

      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish Python package to PyPI
    needs: build-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentic-ops
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  ghcr-publish:
    name: Build and publish container image to GHCR and Docker Hub
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the same release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/nolll77/agentic-ops
            nolll78/agentic-ops
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Overview Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: nolll78/agentic-ops
          readme-filepath: ./docs/DOCKERHUB_README.md

  mcp-registry-publish:
    name: Publish to Official Anthropic MCP Registry
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate via GitHub Actions OIDC
        run: mcp-publisher login github-oidc

      - name: Publish server.json to Official Registry
        run: mcp-publisher publish server.json


